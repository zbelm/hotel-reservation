# Builds the Android app on GitHub's free runners and publishes it as a download:
# https://github.com/<owner>/hotel-reservation/releases/tag/android-latest
name: Android app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project (first run only)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.samplebayhotel --project-name hotel_reservation .
            rm -f test/widget_test.dart   # template test for the counter demo, not this app
            python3 tool/patch_android.py
            echo "NEW_ANDROID=1" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release

      - name: Save the Android project to the repo
        if: env.NEW_ANDROID == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "Add Android project for the mobile app"
          git push

      - name: Publish the app file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SampleBayHotel.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest SampleBayHotel.apk \
            --title "Sample Bay Hotel – Android app" \
            --notes "Built from commit ${GITHUB_SHA::7}. On an Android phone: download SampleBayHotel.apk, open it, and allow installing from this source when asked." \
            --target "$(git rev-parse HEAD)"
