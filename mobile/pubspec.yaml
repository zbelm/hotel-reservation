name: hotel_reservation
description: Guest app for the hotel reservation system (search, book, pay, manage stays).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0 # remembers the chosen language
  pdf: ^3.11.0 # receipt as a PDF
  printing: ^5.13.0 # save, print or share that PDF

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # The website's fonts (SIL Open Font License, see assets/fonts/OFL-*.txt)
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
