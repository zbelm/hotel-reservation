name: hotel_reservation
description: Guest app for the hotel reservation system (search, book, pay, manage stays).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0 # remembers the chosen language
  image_picker: ^1.1.2 # photo of the guest's ID
  pdf: ^3.11.0 # receipt as a PDF
  printing: ^5.13.0 # save, print or share that PDF

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
